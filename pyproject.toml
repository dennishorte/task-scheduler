[project]
name = "task-scheduler"
version = "0.1.0"
description = "Single-machine HTTP task scheduler for agent-driven workloads"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
task-scheduler = "task_scheduler.server:main"
sched = "task_scheduler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task_scheduler"]
